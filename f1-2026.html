/button><span class="mono">RACE REPORTS / F1 2026</span><button id="nnext">NEXT STORY →</button></div>'}function card(d,type){const isD=type==='driver';const t=isD?teams.find(x=>x[0]===d[1]):d;const title=isD?d[0]:d[0],col=['#487e89','#9e4248','#e99851','#345177','#4d6895','#ad7f96'][teams.indexOf(t)%6]||'#527984';return '<div class="flip"><div class="rotor"><div class="face" style="background:'+col+'"><div class="overlay mono">'+(isD?'DRIVER / 2026':t[1]+' '+t[2])+'</div><div class="carshape">'+(isD?'◯':'F1')+'</div><div class="overlay"><h3>'+esc(title)+'</h3><div class="mono">'+esc(isD?d[1]:t[3]+' / '+t[4])+'</div></div></div><div class="face back"><div class="ey">'+(isD?'ORGANISATION':'TEAM / PEOPLE')+'</div><div class="carshape">F1</div><div><h3>'+esc(isD?d[1]:t[3]+' & '+t[4])+'</h3><p>'+esc(isD?t[1]+' '+t[2]:t[5]||'Management dossier in progress')+'</p></div></div></div><div class="cardbar"><button data-go="'+type+'" data-id="'+esc(title)+'">OPEN PROFILE ↗</button><button class="flipbtn">FLIP ↺</button></div></div>'}

function home(){return newsSlider()+'<div class="section"><div class="pair"><section>'+heading('CHAMPIONSHIP / DRIVERS','The front runners','drivers','ALL 22')+['Kimi Antonelli','George Russell','Lewis Hamilton'].map((n,i)=>'<div class="rankitem"><b>0'+(i+1)+'</b><strong>'+n+' · '+points[n]+' PTS</strong><button data-go="driver" data-id="'+n+'">↗</button></div>').join('')+'</section><section>'+heading('CHAMPIONSHIP / TEAMS','The constructors','teams','ALL 11')+['Mercedes','Ferrari','McLaren'].map((n,i)=>'<div class="rankitem"><b>0'+(i+1)+'</b><strong>'+n+'</strong><button data-go="team" data-id="'+n+'">↗</button></div>').join('')+'</section></div><p class="notice">Driver points: verified post-Austin standings, 26 Oct 2026. Full feed integration pending.</p></div>'+soundbite()+'<div class="section">'+heading('PEOPLE / THE GRID','Meet the drivers','drivers','ALL 22')+'<div class="grid">'+orderedDrivers.slice(0,3).map(driverCard).join('')+'</div></div><div class="section">'+heading('ORGANISATIONS / PADDOCK','Explore the teams','teams','ALL 11')+'<div class="grid">'+teams.slice(0,3).map(t=>card(t,'team')).join('')+'</div></div><div class="section">'+heading('SEASON / THE WORLD TOUR','Grand Prix locations','season','ALL EVENTS')+'<div class="events-list">'+races.slice(16).map((r,i)=>eventCard(r,i+16)).join('')+'</div><p class="notice">Hover to see the host location. The selected photograph is retrieved from the relevant Wikipedia page where available.</p></div>'}
function profile(kind,id){let d=kind==='driver'?drivers.find(d=>d[0]===id):teams.find(t=>t[0]===id);if(!d)return '<div class="section">Profile not found.</div>';let t=kind==='driver'?teams.find(t=>t[0]===d[1]):d;return '<div class="profile"><button class="action" style="color:#e6a68f" data-go="'+(kind==='driver'?'drivers':'teams')+'">← ALL '+(kind==='driver'?'DRIVERS':'TEAMS')+'</button><div class="ey" style="color:#ddb0a0">'+(kind==='driver'?'PEOPLE / DRIVER':'ORGANISATION / TEAM')+'</div><h1>'+esc(id)+'</h1><p>'+(kind==='driver'?esc(d[1]):t[1]+' '+t[2])+'</p></div><div class="detail">'+heading('PROFILE / 2026','The dossier')+'<div class="facts">'+(kind==='driver'?'<div class="fact"><span>Team</span><button class="action" data-go="team" data-id="'+esc(d[1])+'">'+esc(d[1])+' ↗</button></div>':'<div class="fact"><span>Headquarters</span><b>'+t[1]+' '+t[2]+'</b></div><div class="fact"><span>Team principal</span><b>'+esc(t[5]||'To be verified')+'</b></div><div class="fact"><span>Drivers</span><b>'+esc(t[3]+' / '+t[4])+'</b></div>')+'</div>'+(kind==='team'?heading('PEOPLE / THE LINE-UP','Drivers')+'<div class="grid">'+drivers.filter(x=>x[1]===id).map(d=>card(d,'driver')).join('')+'</div>':'<p>Verified career milestones, statistics, archived reporting and quotations will populate this page from Sanity.</p>')+'</div>'}
function eventPage(id){const i=Number(id),r=races[i];if(!r)return '';return '<div class="detail"><button class="action" data-go="season">← SEASON</button><div class="ey">2026 / ROUND '+(i+1)+'</div><h1>'+r[3]+' '+r[0]+' GP</h1><div class="eventphoto race" data-photo="'+esc(r[1])+'" style="min-height:330px"><img class="locationphoto" alt="Location: '+esc(r[1])+'"><div class="content"><div class="meta">'+r[2]+' 2026 · '+r[1]+'</div><h2>'+r[1]+'</h2></div></div><div class="facts"><div class="fact"><span>Host location</span><b>'+r[1]+'</b></div><div class="fact"><span>Grand Prix</span><b>'+r[0]+'</b></div><div class="fact"><span>Race date</span><b>'+r[2]+' 2026</b></div></div><p>Race classification, licensed circuit layout, reports and verified soundbites are to be connected via Sanity.</p></div>'}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('sel',b.dataset.page===page));app.innerHTML=page==='home'?home():page==='teams'?'<div class="section">'+heading('FORMULA 1 / 2026','All 11 teams')+'<div class="grid">'+teams.map(t=>card(t,'team')).join('')+'</div></div>':page==='drivers'?'<div class="section">'+heading('FORMULA 1 / 2026','All 22 drivers')+'<div class="grid">'+orderedDrivers.map(driverCard).join('')+'</div></div>':page==='season'?'<div class="section">'+heading('FORMULA 1 / 2026','Season and locations')+'<p>Hover over an event to reveal its host-location photograph. Tap on mobile to see the event page.</p><div class="events">'+races.map(eventCard).join('')+'</div><p class="notice">Original April Bahrain and Saudi Arabia dates were cancelled. Sepang hosts the rescheduled Bahrain GP. Calendar: FIA and Formula 1.</p></div>':page==='radar'?'<div class="section">'+heading('F1 / INTELLIGENCE','The race desk')+'<p>Live standings and classified race results will be connected to licensed, verified data feeds.</p></div>':page==='team'||page==='driver'?profile(page,item):eventPage(item);attachPhotos();const np=document.getElementById('nprev'),nn=document.getElementById('nnext');if(np)np.onclick=()=>{newsIndex=(newsIndex+newsStories.length-1)%newsStories.length;render()};if(nn)nn.onclick=()=>{newsIndex=(newsIndex+1)%newsStories.length;render()};const prev=document.getElementById('qprev'),next=document.getElementById('qnext');if(prev)prev.onclick=()=>{quoteIndex=(quoteIndex+sound.length-1)%sound.length;render()};if(next)next.onclick=()=>{quoteIndex=(quoteIndex+1)%sound.length;render()}}
document.addEventListener('click',e=>{const flip=e.target.closest('.flipbtn');if(flip){flip.closest('.flip').classList.toggle('flipped');return}const b=e.target.closest('[data-go],[data-page]');if(!b)return;page=b.dataset.go||b.dataset.page;item=b.dataset.id||'';render();window.scrollTo({top:0,behavior:'smooth'})});render();
</script></body></html>
